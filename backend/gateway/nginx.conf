worker_processes auto;

# Allow lua to read env vars passed in by Docker.
env JWT_SECRET;
env JWT_ISSUER;
env CORS_ORIGIN;

error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/json;

    # Logging
    log_format main_json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"upstream":"$upstream_addr",'
        '"rt":$request_time,"urt":"$upstream_response_time","ua":"$http_user_agent"}';
    access_log /dev/stdout main_json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Allow lua to load shared modules from /etc/nginx/lua
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Shared dict for caching parsed tokens (optional, helps repeated calls)
    lua_shared_dict jwt_cache 10m;

    # Upstream definitions (internal docker network)
    include /etc/nginx/servers.conf;

    server {
        listen 80;
        server_name _;

        # Generate / propagate request id
        set $request_id_safe $request_id;

        # ----------------------------------------------------------------
        # CORS headers — applied to every response at the server level.
        # The `always` flag adds them to 4xx/5xx responses too, so failed
        # requests don't trigger CORS errors in the browser.
        # Preflight (OPTIONS) is handled per-location below.
        # ----------------------------------------------------------------
        add_header Access-Control-Allow-Origin      "$http_origin" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Request-Id" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age           86400 always;
        add_header Access-Control-Expose-Headers    "X-Request-Id" always;

        # ----------------------------------------------------------------
        # Health check (no auth)
        # ----------------------------------------------------------------
        location = /_health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # ----------------------------------------------------------------
        # Per-namespace routing (each file mounts a `location /api/<scope>`)
        # ----------------------------------------------------------------
        include /etc/nginx/api_conf.d/*.conf;

        # ----------------------------------------------------------------
        # Catch-all — unknown route
        # ----------------------------------------------------------------
        location / {
            default_type application/json;
            return 404 '{"message":"Route not found"}';
        }
    }
}
