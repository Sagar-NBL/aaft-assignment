# Internal service upstreams (reachable via docker compose service names).
# Ports here are the *internal* ports each service listens on (env: *_SERVICE_PORT).

upstream auth-cluster {
    server auth-service:4001;
    keepalive 32;
}

upstream admin-cluster {
    server admin-service:4002;
    keepalive 32;
}

upstream instructor-cluster {
    server instructor-service:4003;
    keepalive 32;
}

upstream student-cluster {
    server student-service:4004;
    keepalive 32;
}

upstream public-cluster {
    server public-service:4005;
    keepalive 32;
}
