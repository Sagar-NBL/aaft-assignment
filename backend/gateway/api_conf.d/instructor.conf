# =====================================================================
# /api/instructor/*  →  instructor-service
# Requires JWT with role=instructor.
# =====================================================================
location /api/instructor/ {
    if ($request_method = OPTIONS) {
        return 204;
    }

    access_by_lua_file /etc/nginx/lua/role_instructor.lua;

    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Request-Id      $request_id_safe;

    proxy_pass http://instructor-cluster;
}
